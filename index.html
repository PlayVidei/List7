                e.currentTarget.classList.remove(
                    "bg-slate-800/80",
                    "text-gray-300"
                );

                e.currentTarget.classList.add(
                    "bg-pink-600",
                    "text-white",
                    "shadow-md"
                );

                currentCategory = e.currentTarget.getAttribute("data-cat");

                currentPage = 1;

                renderGallery();

            });

        });


        // =====================================
        // PENCARIAN
        // =====================================

        searchBtn.addEventListener("click", () => {

            searchQuery = searchInput.value.trim();

            currentPage = 1;

            renderGallery();

        });


        searchInput.addEventListener("input", () => {

            searchQuery = searchInput.value.trim();

            currentPage = 1;

            renderGallery();

        });


        // =====================================
        // BUKA VIDEO PLAYER VIDARA
        // =====================================

        function openPlayer(item) {

            cardInner.classList.add("rotate-y-180");

            mainVideoPlayer.src = item.embed;

            mainVideoPlayer.title = item.title;

            playerVideoTitle.textContent = item.title;

            resetAds();

            startAdSequence();

        }


        // =====================================
        // KEMBALI KE GALERI
        // =====================================

        backToGalleryBtn.addEventListener("click", () => {

            cardInner.classList.remove("rotate-y-180");

            mainVideoPlayer.src = "about:blank";

            playerVideoTitle.textContent = "Pilih video dari galeri";

            clearAllAdTimeouts();

            hideAllAds();

        });


        // =====================================
        // MULAI SIKLUS IKLAN
        // =====================================

        function startAdSequence() {

            clearAllAdTimeouts();

            ad1Closed = false;
            ad2Closed = false;
            ad3Closed = false;


            // Iklan 1: 10 detik

            ad1Timeout = setTimeout(() => {

                showAd1();

            }, 10000);


            // Iklan 3: 11 detik

            ad3Timeout = setTimeout(() => {

                showAd3();

            }, 11000);


            // Iklan 2: 11,5 detik

            ad2Timeout = setTimeout(() => {

                showAd2();

            }, 11500);

        }


        // =====================================
        // TAMPILKAN IKLAN 1
        // =====================================

        function showAd1() {

            if (ad1Cycle >= ad1Data.length) return;

            const currentAd = ad1Data[ad1Cycle];

            document.getElementById("ad1Img").src = currentAd.img;

            document.getElementById("ad1Text").innerText = currentAd.text;

            document.getElementById("ad1BtnText").innerText = currentAd.btn;

            document.getElementById("ad1").classList.remove("hidden");

            ad1Closed = false;

        }


        // =====================================
        // TAMPILKAN IKLAN 2
        // =====================================

        function showAd2() {

            if (ad2Cycle >= ad2Data.length) return;

            const currentAd = ad2Data[ad2Cycle];

            const video = document.getElementById("ad2Video");

            video.src = currentAd.video;

            video.load();

            video.play().catch(() => {});

            document.getElementById("ad2Label").innerText = currentAd.label;

            document.getElementById("ad2").classList.remove("hidden");

            ad2Closed = false;

        }


        // =====================================
        // TAMPILKAN IKLAN 3
        // =====================================

        function showAd3() {

            if (ad3Cycle >= ad3Data.length) return;

            const currentAd = ad3Data[ad3Cycle];

            document.getElementById("ad3Img").src = currentAd.img;

            document.getElementById("ad3Label").innerText = currentAd.label;

            document.getElementById("ad3").classList.remove("hidden");

            ad3Closed = false;

        }


        // =====================================
        // TUTUP IKLAN
        // =====================================

        function closeAd(adId) {

            document.getElementById(adId).classList.add("hidden");


            if (adId === "ad2") {

                const video = document.getElementById("ad2Video");

                video.pause();

                video.removeAttribute("src");

                video.load();

            }


            if (adId === "ad1") ad1Closed = true;

            if (adId === "ad2") ad2Closed = true;

            if (adId === "ad3") ad3Closed = true;


            // Jika semua iklan sudah ditutup,
            // sesi berikutnya dimulai setelah 1 menit.

            if (ad1Closed && ad2Closed && ad3Closed) {

                if (ad1Cycle < ad1Data.length - 1) {

                    clearTimeout(nextSessionTimeout);

                    nextSessionTimeout = setTimeout(() => {

                        if (cardInner.classList.contains("rotate-y-180")) {

                            ad1Cycle++;
                            ad2Cycle++;
                            ad3Cycle++;

                            startAdSequence();

                        }

                    }, 60000);

                }

            }

        }


        // =====================================
        // RESET IKLAN
        // =====================================

        function resetAds() {

            hideAllAds();

            ad1Cycle = 0;
            ad2Cycle = 0;
            ad3Cycle = 0;

            ad1Closed = false;
            ad2Closed = false;
            ad3Closed = false;

            clearTimeout(nextSessionTimeout);

        }


        // =====================================
        // SEMBUNYIKAN SEMUA IKLAN
        // =====================================

        function hideAllAds() {

            document.getElementById("ad1").classList.add("hidden");

            document.getElementById("ad2").classList.add("hidden");

            document.getElementById("ad3").classList.add("hidden");

            const video = document.getElementById("ad2Video");

            video.pause();

            video.removeAttribute("src");

            video.load();

        }


        // =====================================
        // HAPUS SEMUA TIMER IKLAN
        // =====================================

        function clearAllAdTimeouts() {

            clearTimeout(ad1Timeout);

            clearTimeout(ad2Timeout);

            clearTimeout(ad3Timeout);

            clearTimeout(nextSessionTimeout);

        }


        // =====================================
        // JALANKAN GALERI
        // =====================================

        renderGallery();

    </script>

</body>
</html>
