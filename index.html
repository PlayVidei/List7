.player-frame iframe {

    width: 100%;
    height: 100%;

function getFilteredVideos() {
    return videosData.filter(item => {
        const matchCat =
            currentCategory === "Semua" ||
            item.cat === currentCategory;

        const matchSearch =
            item.title.toLowerCase().includes(searchQuery.toLowerCase());

        return matchCat && matchSearch;
    });
}

    const filtered = getFilteredVideos();
    const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;

    if (currentPage > totalPages) {
        currentPage = totalPages;
    }

    const start = (currentPage - 1) * itemsPerPage;
    const items = filtered.slice(start, start + itemsPerPage);

    videoGrid.innerHTML = "";

    items.forEach(item => {

        card.className = "group relative aspect-[3/4] rounded-2xl overflow-hidden glass-card cursor-pointer shadow-lg hover:border-pink-500/50 transition-all";

        const img = document.createElement("img");
        img.src = item.gambar;
        img.alt = item.title;
        img.loading = "lazy";
        img.className = "w-full h-full object-cover group-hover:scale-105 transition-transform duration-500";

        img.onerror = () => {
            img.style.display = "none";
            card.style.background = "#1e293b";
        };

        const overlay = document.createElement("div");
        overlay.className = "absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex flex-col justify-end p-3";

        const category = document.createElement("span");
        category.className = "text-[10px] font-mono text-pink-400 font-semibold mb-1";
        category.textContent = item.cat;

        const title = document.createElement("h3");
        title.className = "text-xs sm:text-sm font-bold text-white line-clamp-2 leading-snug";
        title.textContent = item.title;

        overlay.append(category, title);
        card.append(img, overlay);

        card.addEventListener("click", () => openPlayer(item));
        videoGrid.appendChild(card);
    });

    paginationContainer.innerHTML = `
        <button
            onclick="changePage(${currentPage - 1})"
            ${currentPage === 1 ? "disabled" : ""}
            class="px-3 py-2 ${currentPage === 1 ? "text-gray-600" : "text-gray-300"}">

        </span>

        <button
            onclick="changePage(${currentPage + 1})"
            ${currentPage >= totalPages ? "disabled" : ""}
            class="px-3 py-2 ${currentPage >= totalPages ? "text-gray-600" : "text-gray-300"}">
            Next
        </button>
    `;
}

// =====================================
// PAGINATION
// =====================================

function changePage(page) {
    const totalPages = Math.ceil(getFilteredVideos().length / itemsPerPage);

    if (page >= 1 && page <= totalPages) {
        currentPage = page;
        renderGallery();
    }
}

// =====================================
// KATEGORI
// =====================================

document.querySelectorAll(".cat-pill").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".cat-pill").forEach(b => {
            b.classList.remove("bg-pink-600", "text-white");
            b.classList.add("bg-slate-800", "text-gray-300");
        });

        btn.classList.remove("bg-slate-800", "text-gray-300");
        btn.classList.add("bg-pink-600", "text-white");

        currentCategory = btn.dataset.cat;
        currentPage = 1;
        renderGallery();
    });
});

// =====================================
// PENCARIAN
// =====================================

document.getElementById("searchBtn").addEventListener("click", () => {
    searchQuery = searchInput.value.trim();
    currentPage = 1;
    renderGallery();
});

searchInput.addEventListener("input", () => {
    searchQuery = searchInput.value.trim();
    currentPage = 1;
    renderGallery();
});

// =====================================
// BUKA PLAYER
// =====================================

function openPlayer(item) {
    document.body.classList.add("player-open");

    clearAllAdTimeouts();
    resetAds();

    playerVideoTitle.textContent = item.title;
    mainVideoPlayer.title = item.title;

    /*
      Timer iklan dimulai setelah iframe selesai dimuat.
      Status playback aktual tidak dapat dibaca dari iframe
      lintas domain tanpa API resmi dari penyedia video.
    */

    mainVideoPlayer.onload = function () {
        if (document.body.classList.contains("player-open")) {
            startAdSequence();
        }
    };

    mainVideoPlayer.src = item.embed;
}

// =====================================
// KEMBALI KE GALERI
// =====================================

document.getElementById("backToGalleryBtn").addEventListener("click", () => {
    document.body.classList.remove("player-open");

    clearAllAdTimeouts();
    hideAllAds();

    mainVideoPlayer.onload = null;
    mainVideoPlayer.src = "about:blank";

    playerVideoTitle.textContent = "Pilih video dari galeri";
});

// =====================================
// MULAI IKLAN
// =====================================

function startAdSequence() {
    clearAllAdTimeouts();

    ad1Closed = false;
    ad2Closed = false;
    ad3Closed = false;

    // Iklan 1 muncul pada detik ke-10.
    ad1Timeout = setTimeout(showAd1, 10000);

    // Iklan 3 muncul pada detik ke-11.
    ad3Timeout = setTimeout(showAd3, 11000);

    // Iklan 2 muncul pada detik ke-11,5.
    ad2Timeout = setTimeout(showAd2, 11500);
}

// =====================================
// IKLAN 1
// =====================================

function showAd1() {
    const ad = ad1Data[ad1Cycle];
    if (!ad) return;

    document.getElementById("ad1Img").src = ad.img;
    document.getElementById("ad1Text").textContent = ad.text;
    document.getElementById("ad1BtnText").textContent = ad.btn;

    document.getElementById("ad1").classList.remove("hidden");
    ad1Closed = false;
}

// =====================================
// IKLAN 2
// =====================================

function showAd2() {
    const ad = ad2Data[ad2Cycle];
    if (!ad) return;

    const video = document.getElementById("ad2Video");

    video.src = ad.video;
    video.load();
    video.play().catch(() => {});

    document.getElementById("ad2Label").textContent = ad.label;
    document.getElementById("ad2").classList.remove("hidden");

    ad2Closed = false;
}

// =====================================
// IKLAN 3
// =====================================

function showAd3() {
    const ad = ad3Data[ad3Cycle];
    if (!ad) return;

    document.getElementById("ad3Img").src = ad.img;
    document.getElementById("ad3Label").textContent = ad.label;

    document.getElementById("ad3").classList.remove("hidden");
    ad3Closed = false;
}

// =====================================
// TUTUP IKLAN
// =====================================

function closeAd(adId) {
    const adElement = document.getElementById(adId);
    if (!adElement) return;

    adElement.classList.add("hidden");

    if (adId === "ad2") {
        const video = document.getElementById("ad2Video");

        video.pause();
        video.removeAttribute("src");
        video.load();
    }

    // Setiap iklan memiliki siklus independen.

    if (adId === "ad1" && !ad1Closed) {
        ad1Closed = true;
        ad1Cycle = (ad1Cycle + 1) % ad1Data.length;
    }

    if (adId === "ad2" && !ad2Closed) {
        ad2Closed = true;
        ad2Cycle = (ad2Cycle + 1) % ad2Data.length;
    }

    if (adId === "ad3" && !ad3Closed) {
        ad3Closed = true;
        ad3Cycle = (ad3Cycle + 1) % ad3Data.length;
    }

    // Siklus berikutnya dimulai 60 detik setelah semua iklan ditutup.

    if (ad1Closed && ad2Closed && ad3Closed) {
        clearTimeout(nextSessionTimeout);

        nextSessionTimeout = setTimeout(() => {
            if (document.body.classList.contains("player-open")) {
                startAdSequence();
            }
        }, 60000);
    }
}

// =====================================
// RESET IKLAN
// =====================================

function resetAds() {
    hideAllAds();

    ad1Cycle = 0;
    ad2Cycle = 0;
    ad3Cycle = 0;

    ad1Closed = false;
    ad2Closed = false;
    ad3Closed = false;

    clearAllAdTimeouts();
}

// =====================================
// SEMBUNYIKAN SEMUA IKLAN
// =====================================

function hideAllAds() {
    document.getElementById("ad1").classList.add("hidden");
    document.getElementById("ad2").classList.add("hidden");
    document.getElementById("ad3").classList.add("hidden");

    const video = document.getElementById("ad2Video");

    video.pause();
    video.removeAttribute("src");
    video.load();
}

// =====================================
// HAPUS SEMUA TIMER
// =====================================

function clearAllAdTimeouts() {
    clearTimeout(ad1Timeout);
    clearTimeout(ad2Timeout);
    clearTimeout(ad3Timeout);
    clearTimeout(nextSessionTimeout);

    ad1Timeout = null;
    ad2Timeout = null;
    ad3Timeout = null;
    nextSessionTimeout = null;
}

// =====================================
// JALANKAN GALERI SAAT WEBSITE DIBUKA
// =====================================

renderGallery();
</script>

</body>
</html>
